[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["DJ012", "S101", "S105", "S106", "S311", "B904", "DJ001", "DJ008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"apps/core/management/commands/seed_demo.py" = ["S"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/management/commands/seed_demo.py"]
