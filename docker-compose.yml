# Local / single-server deployment: PostgreSQL + Django API + Next.js web.
# Copy .env.example to .env and fill in the secrets first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samaritan}
      POSTGRES_USER: ${POSTGRES_USER:-samaritan}
      # Postgres refuses to initialise without a password, so a missing .env fails safely.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samaritan}"]
      interval: 5s
      retries: 10
    networks: [backend]

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-samaritan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samaritan}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,api}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    # Not published: the browser reaches the API through the web container's /api/v1 proxy.

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on: [api]
    networks: [frontend]

volumes:
  pgdata:

networks:
  backend:
  frontend:
